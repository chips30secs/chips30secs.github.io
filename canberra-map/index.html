<style>
  *{box-sizing:border-box}

  #map{position:absolute;inset:0;background:#eef0f3}
  .leaflet-control-attribution{font-size:9px}
  /* floating round buttons */
  .fab{position:absolute;z-index:1000;width:56px;height:56px;border-radius:50%;background:#fff;border:none;
    box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:pointer}

  #results div{padding:13px 16px;border-bottom:1px solid #eee;font-size:15px;cursor:pointer}
  #results span{color:#888;font-size:13px}

  #sheet{position:absolute;z-index:1000;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;
    box-shadow:0 -2px 14px rgba(0,0,0,.12);padding:10px 20px calc(18px + env(safe-area-inset-bottom));max-height:55vh;overflow:auto}
  #sheet .grab{width:60px;height:5px;background:#ccc;border-radius:3px;margin:0 auto 12px}
  #sheet h2{margin:0;font-size:24px;font-weight:700;text-align:center}
  #sheet .sub{text-align:center;color:#666;font-size:13px;margin-top:3px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
  .stat{background:#f3f4f6;border-radius:12px;padding:11px 12px}
  .stat .k{font-size:11px;color:#666}
  .stat .v{font-size:19px;font-weight:700;margin-top:2px}

 ["Greenway","Tuggeranong",-35.418,149.068,358000,"ypg"],["Oxley","Tuggeranong",-35.408,149.078],
 ["Monash","Tuggeranong",-35.415,149.090],["Fadden","Tuggeranong",-35.405,149.118],
 ["Gowrie","Tuggeranong",-35.412,149.106],["Macarthur","Tuggeranong",-35.398,149.128],

 ["Calwell","Tuggeranong",-35.440,149.110,845000,"ypg"],["Theodore","Tuggeranong",-35.450,149.121],

].map((r,i)=>({id:i,name:r[0],district:r[1],lat:r[2],lng:r[3],price:r[4]||null,src:r[5]||null}));

const NOTES = {
  "Belconnen":"Town-centre suburb dominated by apartments; very few house sales, so the median can be skewed.",
  "Lawson":"Newer suburb with a small number of house sales; treat the median with caution.",
  "Phillip":"Woden town centre — mostly apartments; few house sales.",
  "Greenway":"Tuggeranong town centre — mostly apartments; few house sales.",
  "Barton":"Mostly apartments and offices; few house sales.",
  "Forrest":"Very few sales per year, all large prestige homes; the median moves a lot."
};

// =====================================================================
//  Canberra Property Map — real suburb boundaries
//  Algorithms: shoelace area + centroid, ray-casting point-in-polygon,
//  log colour scale. Boundaries: Geoscape/PSMA (CC BY 4.0).
// =====================================================================
const PRICE={}; S.forEach(s=>{ if(s.price) PRICE[s.name.toUpperCase()]=s; });

// ---------- geometry helpers ----------
const R=6371008.8, toRad=Math.PI/180;
function rings(g){ return g.type==='Polygon'?[g.coordinates]:g.coordinates; } // list of polygons, each = [outer, ...holes]
// project lng/lat to local metres (good enough within a city)
function proj([lng,lat]){ return [lng*toRad*R*Math.cos(-35.3*toRad), lat*toRad*R]; }
// shoelace formula: signed area + centroid of one ring
function ringStats(ring){
  let a=0,cx=0,cy=0;
  for(let i=0,n=ring.length-1;i<n;i++){
    const [x1,y1]=proj(ring[i]), [x2,y2]=proj(ring[i+1]);
    const c=x1*y2-x2*y1; a+=c; cx+=(x1+x2)*c; cy+=(y1+y2)*c;
  }
  a/=2; return {a, cx:cx/(6*a), cy:cy/(6*a)};
}
function polyStats(g){
  let A=0,X=0,Y=0;
  rings(g).forEach(poly=>poly.forEach((ring,k)=>{
    const s=ringStats(ring), sign=k===0?1:-1, area=Math.abs(s.a)*sign;
    A+=area; X+=s.cx*area; Y+=s.cy*area;
  }));
  const x=X/A, y=Y/A;
  return {area:A, center:[ (y/R)/toRad, (x/(R*Math.cos(-35.3*toRad)))/toRad ]}; // [lat,lng]
}
// ray casting: count how many edges a ray going right from the point crosses
function inRing(pt,ring){
  const [x,y]=pt; let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const [xi,yi]=ring[i],[xj,yj]=ring[j];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function inPoly(pt,g){
  return rings(g).some(poly=> inRing(pt,poly[0]) && !poly.slice(1).some(h=>inRing(pt,h)));
}
function bbox(g){let a=[1e9,1e9,-1e9,-1e9];rings(g).forEach(p=>p[0].forEach(([x,y])=>{a[0]=Math.min(a[0],x);a[1]=Math.min(a[1],y);a[2]=Math.max(a[2],x);a[3]=Math.max(a[3],y);}));return a;}
function inBox(pt,b){return pt[0]>=b[0]&&pt[0]<=b[2]&&pt[1]>=b[1]&&pt[1]<=b[3];}

// ---------- colour ----------
const stops=["#2f8fb0","#36b39f","#e9c046","#ec8a3a","#d63a4f"];
function lerp(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const r=(pa>>16)+((pb>>16)-(pa>>16))*t,g=((pa>>8)&255)+(((pb>>8)&255)-((pa>>8)&255))*t,bl=(pa&255)+((pb&255)-(pa&255))*t;
  return '#'+((1<<24)+(Math.round(r)<<16)+(Math.round(g)<<8)+Math.round(bl)).toString(16).slice(1);}
function color(p){let t=(Math.log(p)-Math.log(400000))/(Math.log(2500000)-Math.log(400000));t=Math.max(0,Math.min(1,t));
  const i=Math.min(stops.length-2,Math.floor(t*(stops.length-1)));return lerp(stops[i],stops[i+1],t*(stops.length-1)-i);}
const fmt=v=>v>=1e6?'$'+(v/1e6).toFixed(v>=1e7?1:2).replace(/0$/,'')+'M':'$'+Math.round(v/1000)+'k';

// ---------- map ----------
const map=L.map('map',{zoomControl:false}).setView([-35.30,149.10],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · Boundaries &copy; Geoscape Australia (CC BY 4.0)'}).addTo(map);

const sheet=document.getElementById('sheet');
function setSheetH(){document.documentElement.style.setProperty('--sheet',sheet.offsetHeight+'px');}
sheet.innerHTML='<div class="grab"></div><h2>Loading suburbs…</h2>'; setSheetH();

let SUBS=[], DISTS=[], selected=null, fillLayer, distLayer, pinLayer, nameLayer, cityBounds;
const DIST_NAME={"Canberra Central":"Inner Canberra"};

fetch('suburbs.json').then(r=>r.json()).then(init).catch(e=>{
  sheet.innerHTML='<div class="grab"></div><h2>Could not load suburb boundaries</h2><div class="sub">'+e+'</div>'; setSheetH();
});

function init(fc){
  fc.features.forEach(f=>{
    const st=polyStats(f.geometry), o={name:f.properties.name, geom:f.geometry, box:bbox(f.geometry), area:st.area, center:st.center, feature:f};
    (f.properties.kind==='district'?DISTS:SUBS).push(o);
  });
  // assign each suburb to a district with point-in-polygon on its centroid
  SUBS.forEach(s=>{
    const pt=[s.center[1],s.center[0]];
    const d=DISTS.find(d=>inBox(pt,d.box)&&inPoly(pt,d.geom));
    s.district=d?(DIST_NAME[d.name]||d.name):'Outer ACT';
    const p=PRICE[s.name.toUpperCase()]; if(p){s.price=p.price; s.src=p.src;}
  });
  DISTS.forEach(d=>{
    d.label=DIST_NAME[d.name]||d.name;
    const ps=SUBS.filter(s=>s.district===d.label&&s.price).map(s=>s.price).sort((a,b)=>a-b);
    d.median=ps.length?ps[Math.floor(ps.length/2)]:null; d.n=ps.length;
  });

  // suburb fills (non-interactive: taps go through our own point-in-polygon test)
  fillLayer=L.geoJSON({type:'FeatureCollection',features:SUBS.map(s=>s.feature)},{
    interactive:false,
    style:f=>{const s=SUBS.find(x=>x.feature===f);return {color:'#ffffff',weight:1.2,fillColor:s.price?color(s.price):'#9aa3ad',fillOpacity:s.price?.5:.15};}
  }).addTo(map);
  SUBS.forEach(s=>{ fillLayer.eachLayer(l=>{ if(l.feature===s.feature) s.layer=l; }); });

  distLayer=L.layerGroup();
  DISTS.forEach(d=>{
    L.geoJSON(d.feature,{interactive:false,style:{color:'#222',weight:2.2,dashArray:'6 5',fill:false}}).addTo(distLayer);
    const lab=L.marker(d.center,{icon:L.divIcon({className:'',iconSize:[0,0],
      html:`<div class="pin" style="--c:${d.median?color(d.median):'#bbb'};font-size:13px;padding:6px 12px">${d.label}<b>${d.median?'median '+fmt(d.median):'no data'}</b></div>`})});
    lab.on('click',()=>map.flyToBounds(L.geoJSON(d.feature).getBounds(),{duration:.8})); lab.addTo(distLayer);
  });

  pinLayer=L.layerGroup(); nameLayer=L.layerGroup();
  SUBS.forEach(s=>{
    s.marker=L.marker(s.center,{icon:pinIcon(s,false)}).on('click',()=>selectSuburb(s,true));
    (s.price?pinLayer:nameLayer).addLayer(s.marker);
  });

  cityBounds=L.geoJSON({type:'FeatureCollection',features:DISTS.map(d=>d.feature)}).getBounds();
  map.fitBounds(cityBounds);
  map.on('zoomend',onZoom); onZoom();
  showCity();
}

function pinIcon(s,sel){
  const cls='pin'+(s.price?'':' nod')+(sel?' sel':'');
  const html=s.price||sel?`<div class="${cls}" style="--c:${s.price?color(s.price):'#bbb'}">${s.price?fmt(s.price):s.name}${s.price?`<b>${s.name}</b>`:''}</div>`
    :`<div class="pin nod" style="font-size:10px;padding:2px 7px">${s.name}</div>`;
  return L.divIcon({html,className:'',iconSize:[0,0]});
}

function onZoom(){
  const z=map.getZoom();
  z<12? distLayer.addTo(map): distLayer.remove();
  z>=12? pinLayer.addTo(map): pinLayer.remove();
  z>=14? nameLayer.addTo(map): nameLayer.remove();
  const op=z>=16?.12:z>=15?.25:z>=12?.42:.55;
  SUBS.forEach(s=>s.layer.setStyle({fillOpacity:s.price?op:Math.min(op,.15)}));
  if(selected){ selected.marker.addTo(map); selected.layer.setStyle({fillOpacity:Math.max(.08,op-.15)}); }
}

// ---------- selection ----------
function suburbAt(latlng){
  const pt=[latlng.lng,latlng.lat];
  return SUBS.find(s=>inBox(pt,s.box)&&inPoly(pt,s.geom));
}
map.on('click',e=>{ const s=suburbAt(e.latlng); if(s) selectSuburb(s,map.getZoom()<13); });

function ranked(){return SUBS.filter(s=>s.price).sort((a,b)=>b.price-a.price);}
function selectSuburb(s,fly){
  if(selected){ selected.marker.setIcon(pinIcon(selected,false)); selected.layer.setStyle({color:'#fff',weight:1.2}); if(!selected.price&&map.getZoom()<14) selected.marker.remove(); }
  selected=s; s.marker.setIcon(pinIcon(s,true)); s.marker.addTo(map); s.marker.setZIndexOffset(1000);
  s.layer.setStyle({color:'#000',weight:3}); s.layer.bringToFront();
  if(fly) map.flyToBounds(s.layer.getBounds(),{padding:[30,30],paddingBottomRight:[0,innerHeight*0.35],duration:.9});
  onZoom();
  const peers=SUBS.filter(x=>x.district===s.district&&x.price).map(x=>x.price).sort((a,b)=>a-b);
  const dMed=peers.length?peers[Math.floor(peers.length/2)]:null;
  const km2=(s.area/1e6).toFixed(2);
  let body;
  if(s.price){
    const rk=ranked(), diff=(s.price/CITY.house-1)*100, rank=rk.indexOf(s)+1;
    body=`<div class="stats">
      <div class="stat"><div class="k">Median house</div><div class="v">${fmt(s.price)}</div></div>
      <div class="stat"><div class="k">vs Canberra</div><div class="v ${diff>0?'up':'down'}">${diff>0?'+':''}${diff.toFixed(0)}%</div></div>
      <div class="stat"><div class="k">${s.district} median</div><div class="v">${dMed?fmt(dMed):'—'}</div></div>
      <div class="stat"><div class="k">Price rank</div><div class="v">#${rank} <span style="font-size:12px;color:#888;font-weight:500">of ${rk.length}</span></div></div>
      <div class="stat"><div class="k">Suburb area</div><div class="v">${km2} km²</div></div>
      <div class="stat"><div class="k">District</div><div class="v" style="font-size:15px">${s.district}</div></div>
    </div>
    ${NOTES[s.name]?`<div class="note warn">⚠ ${NOTES[s.name]}</div>`:''}
    <div class="note">Price source: <a href="${SRC[s.src].url}">${SRC[s.src].name}</a></div>`;
    document.getElementById('pillVal').textContent=fmt(s.price);
  } else {
    body=`<div class="stats">
      <div class="stat"><div class="k">Median house</div><div class="v" style="color:#999">no data yet</div></div>
      <div class="stat"><div class="k">${s.district} median</div><div class="v">${dMed?fmt(dMed):'—'}</div></div>
      <div class="stat"><div class="k">Suburb area</div><div class="v">${km2} km²</div></div>
      <div class="stat"><div class="k">District</div><div class="v" style="font-size:15px">${s.district}</div></div></div>`;
    document.getElementById('pillVal').textContent='—';
  }
  sheet.innerHTML=`<div class="grab"></div><h2>${s.name}</h2><div class="sub">${s.district}</div>${body}
    <button class="btn" id="back">← All of Canberra</button>`;
  document.getElementById('back').onclick=goHome; setSheetH();
}
function goHome(){
  if(selected){ selected.marker.setIcon(pinIcon(selected,false)); selected.layer.setStyle({color:'#fff',weight:1.2}); selected=null; }
  map.flyToBounds(cityBounds,{duration:.8}); showCity();
}
document.getElementById('home').onclick=goHome;

const legend=`<div class="legend">$400k <i style="background:linear-gradient(90deg,${stops.join(',')})"></i> $2.5M+</div>`;
function showCity(){
  const rk=ranked(), row=s=>`<div class="row" data-n="${s.name}"><span>${s.name}</span><b>${fmt(s.price)}</b></div>`;
  sheet.innerHTML=`<div class="grab"></div>
    <h2>Canberra</h2>
    <div class="sub">Median house ${fmt(CITY.house)} · units ${fmt(CITY.unit)} · <span class="down">${CITY.yoy}% / yr</span></div>
    ${legend}
    <div class="note" style="text-align:center">${SUBS.length} suburbs · ${rk.length} with price data (grey = no data yet). Tap any suburb.</div>
    <details style="margin-top:8px"><summary style="font-size:13px;cursor:pointer">Most and least expensive suburbs</summary>
      ${rk.slice(0,5).map(row).join('')}<div style="height:6px"></div>${rk.slice(-5).reverse().map(row).join('')}
    </details>
    <div class="note">City figures: <a href="${CITY.url}">${CITY.src}</a>. Boundaries: Geoscape Administrative Boundaries (2017), CC BY 4.0.</div>`;
  sheet.querySelectorAll('[data-n]').forEach(el=>el.onclick=()=>selectSuburb(SUBS.find(s=>s.name===el.dataset.n),true));
  setSheetH(); document.getElementById('pillVal').textContent=fmt(CITY.house);
}

// ---------- heat toggle ----------
let fillsOn=true;
document.getElementById('layers').onclick=()=>{ if(!fillLayer) return; fillsOn=!fillsOn; fillsOn?fillLayer.addTo(map):fillLayer.remove(); };

// ---------- search ----------
const box=document.getElementById('searchBox'), q=document.getElementById('q'), res=document.getElementById('results');
document.getElementById('find').onclick=()=>{const open=box.style.display==='block'; box.style.display=open?'none':'block'; if(!open){q.value='';res.innerHTML='';q.focus();}};
q.addEventListener('input',()=>{
  const t=q.value.trim().toLowerCase(); if(!t){res.innerHTML='';return;}
  const m=SUBS.filter(s=>s.name.toLowerCase().includes(t)).slice(0,8);
  res.innerHTML=m.map(s=>`<div data-n="${s.name}">${s.name} <span>· ${s.district}${s.price?' · '+fmt(s.price):''}</span></div>`).join('')||'<div style="color:#888">No match</div>';
  res.querySelectorAll('[data-n]').forEach(el=>el.onclick=()=>{box.style.display='none';q.blur();selectSuburb(SUBS.find(s=>s.name===el.dataset.n),true);});
});

// ---------- my location (point-in-polygon tells you your suburb) ----------
let me=null;
document.getElementById('locate').onclick=()=>{
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p=>{
    const ll=L.latLng(p.coords.latitude,p.coords.longitude);
    if(me) me.setLatLng(ll); else me=L.circleMarker(ll,{radius:9,color:'#fff',weight:3,fillColor:'#1d6fe0',fillOpacity:1}).addTo(map);
    const s=suburbAt(ll); if(s) selectSuburb(s,false);
    map.flyTo(ll,15);
  },()=>{},{enableHighAccuracy:true,timeout:10000});
};
addEventListener('resize',setSheetH);
</script>
</body>
</html>
