<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Canberra Property Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:#111;overflow:hidden}
  #map{position:absolute;inset:0;background:#eef0f3}
  .leaflet-control-attribution{font-size:9px}
  /* floating round buttons */
  .fab{position:absolute;z-index:1000;width:56px;height:56px;border-radius:50%;background:#fff;border:none;
    box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .fab svg{width:26px;height:26px}
  #home{top:calc(14px + env(safe-area-inset-top));left:14px}
  #find{top:calc(14px + env(safe-area-inset-top));right:14px}
  #locate{right:14px;bottom:calc(var(--sheet,170px) + 16px)}
  #layers{right:14px;bottom:calc(var(--sheet,170px) + 84px)}
  /* black pill */
  #pill{position:absolute;z-index:1000;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    background:#000;color:#fff;border-radius:30px;padding:10px 20px;font-weight:800;font-size:20px;display:flex;gap:10px;align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.25);white-space:nowrap}
  #pill small{font-size:11px;font-weight:500;color:#bbb;display:block;line-height:1}
  #pill .dia{width:16px;height:16px;background:#6b7a8a;transform:rotate(45deg);border-radius:2px}
  /* search */
  #searchBox{position:absolute;z-index:1100;top:calc(80px + env(safe-area-inset-top));left:14px;right:14px;display:none}
  #searchBox input{width:100%;padding:14px 16px;border-radius:14px;border:none;font:inherit;font-size:16px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
  #results{background:#fff;border-radius:14px;margin-top:6px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.15)}
  #results div{padding:13px 16px;border-bottom:1px solid #eee;font-size:15px;cursor:pointer}
  #results span{color:#888;font-size:13px}
  /* bottom sheet */
  #sheet{position:absolute;z-index:1000;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;
    box-shadow:0 -2px 14px rgba(0,0,0,.12);padding:10px 20px calc(18px + env(safe-area-inset-bottom));max-height:55vh;overflow:auto}
  #sheet .grab{width:60px;height:5px;background:#ccc;border-radius:3px;margin:0 auto 12px}
  #sheet h2{margin:0;font-size:24px;font-weight:700;text-align:center}
  #sheet .sub{text-align:center;color:#666;font-size:13px;margin-top:3px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
  .stat{background:#f3f4f6;border-radius:12px;padding:11px 12px}
  .stat .k{font-size:11px;color:#666}
  .stat .v{font-size:19px;font-weight:700;margin-top:2px}
  .up{color:#c2410c}.down{color:#15803d}
  .note{font-size:11.5px;color:#777;line-height:1.45;margin-top:8px}
  .warn{color:#b45309}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:14px;cursor:pointer}
  .btn{display:inline-block;margin-top:10px;background:#f3f4f6;border:none;border-radius:10px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer}
  a{color:#1d6fe0}
  /* price pins */
  .pin{background:#fff;border-radius:20px;padding:4px 9px;font-weight:700;font-size:12px;white-space:nowrap;
    box-shadow:0 1px 5px rgba(0,0,0,.3);border:2px solid var(--c);transform:translate(-50%,-50%);display:inline-block;position:absolute}
  .pin.nod{border-color:#bbb;color:#888;font-weight:500}
  .pin.sel{background:#000;color:#fff;border-color:#000}
  .pin b{display:block;font-size:9px;font-weight:600;color:#666;text-align:center;line-height:1}
  .pin.sel b{color:#bbb}
  .legend{display:flex;align-items:center;gap:6px;font-size:11px;color:#666;justify-content:center;margin-top:10px}
  .legend i{display:inline-block;width:120px;height:8px;border-radius:4px}
</style>
</head>
<body>
<div id="map"></div>

<button class="fab" id="home" title="All of Canberra"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
<div id="pill"><span class="dia"></span><span id="pillVal">$1.01M</span></div>
<button class="fab" id="find" title="Search"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
<button class="fab" id="layers" title="Toggle price heat"><svg viewBox="0 0 24 24" fill="#000"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="6" width="4" height="15" rx="1"/><rect x="17" y="9" width="4" height="12" rx="1"/></svg></button>
<button class="fab" id="locate" title="My location"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" fill="#000"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>

<div id="searchBox"><input id="q" placeholder="Search a Canberra suburb" autocomplete="off"><div id="results"></div></div>
<div id="sheet"></div>

<script>
const SRC = {
  ypg: {name:"YourPropertyGuide (state revenue sales data, last refreshed Dec 2024)", url:"https://www.yourpropertyguide.com.au/property-market/canberra"},
  ah1: {name:"Allhomes / Domain, Aug 2026", url:"https://www.allhomes.com.au/news/the-canberra-suburbs-where-house-prices-have-surged-by-up-to-23-per-cent-2-1543627/"},
  ah2: {name:"Allhomes / Domain, 2025 annual (pub. Apr 2026)", url:"https://www.allhomes.com.au/news/the-south-canberra-enclave-where-house-prices-jumped-17-per-cent-1501603"}
};
const CITY = {house:1006269, unit:582245, yoy:-1.5, src:"Cotality, Sept 2026", url:"https://openagent.com.au/suburb-profiles/canberra-property-market"};

const S = [
 // Inner North
 ["Ainslie","Inner North",-35.262,149.147],["Braddon","Inner North",-35.272,149.137,1720000,"ypg"],
 ["Turner","Inner North",-35.268,149.125,2195000,"ypg"],["Reid","Inner North",-35.285,149.139,2350000,"ypg"],
 ["Campbell","Inner North",-35.290,149.155,1715000,"ypg"],["Dickson","Inner North",-35.250,149.140],
 ["Lyneham","Inner North",-35.250,149.125,1232500,"ypg"],["O'Connor","Inner North",-35.258,149.113],
 ["Downer","Inner North",-35.244,149.146],["Watson","Inner North",-35.237,149.158,1105000,"ypg"],
 ["Hackett","Inner North",-35.249,149.163],["Acton","Inner North",-35.280,149.115],
 // Inner South
 ["Parkes","Inner South",-35.298,149.135],["Barton","Inner South",-35.307,149.138,620000,"ypg"],
 ["Forrest","Inner South",-35.316,149.127,5000000,"ypg"],["Griffith","Inner South",-35.326,149.137],
 ["Kingston","Inner South",-35.316,149.147],["Narrabundah","Inner South",-35.336,149.150,1470000,"ah2"],
 ["Red Hill","Inner South",-35.336,149.120],["Deakin","Inner South",-35.320,149.104,2100000,"ah1"],
 ["Yarralumla","Inner South",-35.304,149.099,2228000,"ypg"],["Fyshwick","Inner South",-35.330,149.172],
 // Belconnen
 ["Belconnen","Belconnen",-35.238,149.068,429000,"ypg"],["Bruce","Belconnen",-35.243,149.091,1276000,"ypg"],
 ["Lawson","Belconnen",-35.224,149.090,429000,"ypg"],["Kaleen","Belconnen",-35.230,149.106,1003250,"ypg"],
 ["Giralang","Belconnen",-35.211,149.096],["Evatt","Belconnen",-35.211,149.068],
 ["McKellar","Belconnen",-35.218,149.078],["Florey","Belconnen",-35.226,149.050],
 ["Scullin","Belconnen",-35.234,149.039,787000,"ypg"],["Holt","Belconnen",-35.225,149.012,790000,"ypg"],
 ["Higgins","Belconnen",-35.232,149.027],["Macgregor","Belconnen",-35.210,149.010],
 ["Dunlop","Belconnen",-35.194,149.020,838000,"ypg"],["Charnwood","Belconnen",-35.200,149.034,715000,"ypg"],
 ["Fraser","Belconnen",-35.191,149.045],["Melba","Belconnen",-35.210,149.053],
 ["Spence","Belconnen",-35.198,149.065],["Page","Belconnen",-35.238,149.050],
 ["Hawker","Belconnen",-35.246,149.037],["Weetangera","Belconnen",-35.251,149.050],
 ["Aranda","Belconnen",-35.258,149.081],["Cook","Belconnen",-35.260,149.066],
 ["Macquarie","Belconnen",-35.250,149.064],["Strathnairn","Belconnen",-35.218,148.990],
 ["Macnamara","Belconnen",-35.202,148.992],
 // Gungahlin
 ["Gungahlin","Gungahlin",-35.185,149.133,996000,"ypg"],["Amaroo","Gungahlin",-35.170,149.128,1015000,"ypg"],
 ["Bonner","Gungahlin",-35.160,149.140,890000,"ypg"],["Casey","Gungahlin",-35.167,149.095,890000,"ypg"],
 ["Franklin","Gungahlin",-35.199,149.143,985000,"ypg"],["Harrison","Gungahlin",-35.201,149.157,1025000,"ypg"],
 ["Ngunnawal","Gungahlin",-35.172,149.110,811100,"ypg"],["Nicholls","Gungahlin",-35.187,149.096,1250000,"ypg"],
 ["Palmerston","Gungahlin",-35.195,149.120],["Crace","Gungahlin",-35.203,149.107],
 ["Forde","Gungahlin",-35.165,149.148],["Throsby","Gungahlin",-35.187,149.160],
 ["Mitchell","Gungahlin",-35.215,149.130],["Taylor","Gungahlin",-35.150,149.110],
 ["Jacka","Gungahlin",-35.152,149.131],["Moncrieff","Gungahlin",-35.160,149.116],
 // Woden Valley
 ["Phillip","Woden Valley",-35.350,149.090,396000,"ypg"],["Garran","Woden Valley",-35.342,149.108,1605000,"ypg"],
 ["Hughes","Woden Valley",-35.333,149.095],["Curtin","Woden Valley",-35.325,149.078],
 ["Lyons","Woden Valley",-35.340,149.075],["Chifley","Woden Valley",-35.355,149.077],
 ["Pearce","Woden Valley",-35.362,149.083],["Torrens","Woden Valley",-35.372,149.088],
 ["Mawson","Woden Valley",-35.365,149.099],["Farrer","Woden Valley",-35.377,149.104],
 ["Isaacs","Woden Valley",-35.368,149.115],["O'Malley","Woden Valley",-35.352,149.113],
 // Weston Creek
 ["Weston","Weston Creek",-35.340,149.055],["Holder","Weston Creek",-35.335,149.045],
 ["Duffy","Weston Creek",-35.335,149.032],["Rivett","Weston Creek",-35.347,149.037],
 ["Stirling","Weston Creek",-35.350,149.048],["Chapman","Weston Creek",-35.357,149.037],
 ["Fisher","Weston Creek",-35.360,149.057],["Waramanga","Weston Creek",-35.353,149.063],
 // Molonglo Valley
 ["Coombs","Molonglo Valley",-35.316,149.042],["Wright","Molonglo Valley",-35.322,149.032],
 ["Denman Prospect","Molonglo Valley",-35.302,149.025],["Whitlam","Molonglo Valley",-35.285,149.035],
 // Tuggeranong
 ["Kambah","Tuggeranong",-35.385,149.058,860000,"ypg"],["Wanniassa","Tuggeranong",-35.398,149.090,880000,"ypg"],
 ["Greenway","Tuggeranong",-35.418,149.068,358000,"ypg"],["Oxley","Tuggeranong",-35.408,149.078],
 ["Monash","Tuggeranong",-35.415,149.090],["Fadden","Tuggeranong",-35.405,149.118],
 ["Gowrie","Tuggeranong",-35.412,149.106],["Macarthur","Tuggeranong",-35.398,149.128],
 ["Chisholm","Tuggeranong",-35.420,149.125],["Richardson","Tuggeranong",-35.428,149.114],
 ["Calwell","Tuggeranong",-35.440,149.110,845000,"ypg"],["Theodore","Tuggeranong",-35.450,149.121],
 ["Isabella Plains","Tuggeranong",-35.428,149.093],["Bonython","Tuggeranong",-35.433,149.080],
 ["Gordon","Tuggeranong",-35.455,149.083],["Conder","Tuggeranong",-35.460,149.100],
 ["Banks","Tuggeranong",-35.471,149.100,862500,"ah1"],["Gilmore","Tuggeranong",-35.420,149.136]
].map((r,i)=>({id:i,name:r[0],district:r[1],lat:r[2],lng:r[3],price:r[4]||null,src:r[5]||null}));

const NOTES = {
  "Belconnen":"Town-centre suburb dominated by apartments; very few house sales, so the median can be skewed.",
  "Lawson":"Newer suburb with a small number of house sales; treat the median with caution.",
  "Phillip":"Woden town centre — mostly apartments; few house sales.",
  "Greenway":"Tuggeranong town centre — mostly apartments; few house sales.",
  "Barton":"Mostly apartments and offices; few house sales.",
  "Forrest":"Very few sales per year, all large prestige homes; the median moves a lot."
};

// ---------- MAP ----------
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([-35.30,149.10],11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
  maxZoom:20, subdomains:'abcd',
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
}).addTo(map);

const cityBounds=L.latLngBounds(S.map(s=>[s.lat,s.lng])).pad(0.05);
map.fitBounds(cityBounds);

// colour scale (log) teal -> yellow -> orange -> red
const stops=["#2f8fb0","#36b39f","#e9c046","#ec8a3a","#d63a4f"];
function lerp(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const r=(pa>>16)+((pb>>16)-(pa>>16))*t,g=((pa>>8)&255)+(((pb>>8)&255)-((pa>>8)&255))*t,bl=(pa&255)+((pb&255)-(pa&255))*t;
  return '#'+((1<<24)+(Math.round(r)<<16)+(Math.round(g)<<8)+Math.round(bl)).toString(16).slice(1);}
function color(p){let t=(Math.log(p)-Math.log(400000))/(Math.log(2500000)-Math.log(400000));t=Math.max(0,Math.min(1,t));
  const i=Math.min(stops.length-2,Math.floor(t*(stops.length-1)));return lerp(stops[i],stops[i+1],t*(stops.length-1)-i);}

// soft heat blobs (stacked translucent circles)
const heat=L.layerGroup().addTo(map);
S.filter(s=>s.price).forEach(s=>{
  const c=color(s.price);
  [[1100,.10],[750,.14],[420,.18]].forEach(([r,o])=>L.circle([s.lat,s.lng],{radius:r,stroke:false,fillColor:c,fillOpacity:o,interactive:false}).addTo(heat));
});
let heatOn=true;
document.getElementById('layers').onclick=()=>{heatOn=!heatOn; heatOn?heat.addTo(map):heat.remove();};

// price pins
const fmt=v=>v>=1e6?'$'+(v/1e6).toFixed(v>=1e7?1:2).replace(/0$/,'')+'M':'$'+Math.round(v/1000)+'k';
const markers=S.map(s=>{
  const m=L.marker([s.lat,s.lng],{icon:pinIcon(s,false),riseOnHover:true}).on('click',()=>selectSuburb(s,true));
  s.marker=m; return m;
});
function pinIcon(s,sel){
  const cls='pin'+(s.price?'':' nod')+(sel?' sel':'');
  const html=`<div class="${cls}" style="--c:${s.price?color(s.price):'#bbb'}">${s.price?fmt(s.price):'—'}<b>${s.name}</b></div>`;
  return L.divIcon({html,className:'',iconSize:[0,0]});
}
const pinLayer=L.layerGroup(markers);
function updatePins(){
  const z=map.getZoom();
  if(z>=12){ if(!map.hasLayer(pinLayer)) pinLayer.addTo(map); }
  else { if(map.hasLayer(pinLayer)) pinLayer.remove(); if(selected) selected.marker.addTo(map); }
}
map.on('zoomend',updatePins); updatePins();

// district labels at city zoom
const districts={};S.forEach(s=>{(districts[s.district]=districts[s.district]||[]).push(s);});
const distLayer=L.layerGroup(Object.entries(districts).map(([name,list])=>{
  const lat=list.reduce((a,s)=>a+s.lat,0)/list.length, lng=list.reduce((a,s)=>a+s.lng,0)/list.length;
  const withP=list.filter(s=>s.price).map(s=>s.price).sort((a,b)=>a-b);
  const med=withP.length?withP[Math.floor(withP.length/2)]:null;
  return L.marker([lat,lng],{icon:L.divIcon({className:'',iconSize:[0,0],
    html:`<div class="pin" style="--c:${med?color(med):'#bbb'};font-size:13px;padding:6px 12px">${name}<b>${med?'median '+fmt(med):'no data'}</b></div>`})})
    .on('click',()=>map.flyToBounds(L.latLngBounds(list.map(s=>[s.lat,s.lng])).pad(0.3),{duration:.8}));
}));
function updateDist(){ map.getZoom()<12? distLayer.addTo(map): distLayer.remove(); }
map.on('zoomend',updateDist); updateDist();

// ---------- SHEET ----------
const sheet=document.getElementById('sheet');
const ranked=S.filter(s=>s.price).sort((a,b)=>b.price-a.price);
function setSheetH(){document.documentElement.style.setProperty('--sheet',sheet.offsetHeight+'px');}
const legend=`<div class="legend">$400k <i style="background:linear-gradient(90deg,${stops.join(',')})"></i> $2.5M+</div>`;

function showCity(){
  sheet.innerHTML=`<div class="grab"></div>
    <h2>Canberra</h2>
    <div class="sub">Median house ${fmt(CITY.house)} · units ${fmt(CITY.unit)} · <span class="down">${CITY.yoy}% / yr</span></div>
    ${legend}
    <div class="note" style="text-align:center">Tap a district or suburb. Zoom right in to see streets and buildings.</div>
    <details style="margin-top:8px"><summary style="font-size:13px;cursor:pointer">Most and least expensive suburbs</summary>
      ${ranked.slice(0,5).map(r).join('')}<div style="height:6px"></div>${ranked.slice(-5).reverse().map(r).join('')}
    </details>
    <div class="note">City figures: <a href="${CITY.url}">${CITY.src}</a>. Suburb pins sit at approximate suburb centres.</div>`;
  bindRows(); setSheetH();
  document.getElementById('pillVal').textContent=fmt(CITY.house);
}
function r(s){return `<div class="row" data-id="${s.id}"><span>${s.name}</span><b>${fmt(s.price)}</b></div>`;}
function bindRows(){sheet.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>selectSuburb(S[+el.dataset.id],true));}

let selected=null;
function selectSuburb(s,fly){
  if(selected) selected.marker.setIcon(pinIcon(selected,false));
  selected=s; s.marker.setIcon(pinIcon(s,true)); s.marker.addTo(map); s.marker.setZIndexOffset(1000);
  if(fly) map.flyTo([s.lat,s.lng],15,{duration:.9});
  const peers=S.filter(x=>x.district===s.district&&x.price).map(x=>x.price).sort((a,b)=>a-b);
  const dMed=peers.length?peers[Math.floor(peers.length/2)]:null;
  let body;
  if(s.price){
    const diff=(s.price/CITY.house-1)*100, rank=ranked.indexOf(s)+1;
    body=`<div class="stats">
      <div class="stat"><div class="k">Median house</div><div class="v">${fmt(s.price)}</div></div>
      <div class="stat"><div class="k">vs Canberra</div><div class="v ${diff>0?'up':'down'}">${diff>0?'+':''}${diff.toFixed(0)}%</div></div>
      <div class="stat"><div class="k">${s.district} median</div><div class="v">${dMed?fmt(dMed):'—'}</div></div>
      <div class="stat"><div class="k">Price rank</div><div class="v">#${rank} <span style="font-size:12px;color:#888;font-weight:500">of ${ranked.length}</span></div></div>
    </div>
    ${NOTES[s.name]?`<div class="note warn">⚠ ${NOTES[s.name]}</div>`:''}
    <div class="note">Source: <a href="${SRC[s.src].url}">${SRC[s.src].name}</a></div>`;
    document.getElementById('pillVal').textContent=fmt(s.price);
  } else {
    body=`<div class="note" style="font-size:13px;text-align:center">No median house price loaded for ${s.name} yet.${dMed?` ${s.district} district median: <b style="color:#111">${fmt(dMed)}</b>.`:''}</div>`;
    document.getElementById('pillVal').textContent='—';
  }
  sheet.innerHTML=`<div class="grab"></div><h2>${s.name}</h2><div class="sub">${s.district} district</div>${body}
    <button class="btn" id="back">← All of Canberra</button>`;
  document.getElementById('back').onclick=goHome; setSheetH();
}
function goHome(){
  if(selected){selected.marker.setIcon(pinIcon(selected,false));selected=null;}
  map.flyToBounds(cityBounds,{duration:.8}); showCity();
}
document.getElementById('home').onclick=goHome;

// tapping the map when zoomed in picks the nearest suburb
map.on('click',e=>{
  if(map.getZoom()<13) return;
  let best=null,bd=1e9;
  S.forEach(s=>{const d=map.distance(e.latlng,[s.lat,s.lng]); if(d<bd){bd=d;best=s;}});
  if(best && bd<2500) selectSuburb(best,false);
});

// ---------- SEARCH ----------
const box=document.getElementById('searchBox'), q=document.getElementById('q'), res=document.getElementById('results');
document.getElementById('find').onclick=()=>{const open=box.style.display==='block'; box.style.display=open?'none':'block'; if(!open){q.value='';res.innerHTML='';q.focus();}};
q.addEventListener('input',()=>{
  const t=q.value.trim().toLowerCase(); if(!t){res.innerHTML='';return;}
  const m=S.filter(s=>s.name.toLowerCase().includes(t)).slice(0,8);
  res.innerHTML=m.map(s=>`<div data-id="${s.id}">${s.name} <span>· ${s.district}${s.price?' · '+fmt(s.price):''}</span></div>`).join('')||'<div style="color:#888">No match</div>';
  res.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>{box.style.display='none';q.blur();selectSuburb(S[+el.dataset.id],true);});
});

// ---------- MY LOCATION ----------
let me=null;
document.getElementById('locate').onclick=()=>{
  if(!navigator.geolocation){return;}
  navigator.geolocation.getCurrentPosition(p=>{
    const ll=[p.coords.latitude,p.coords.longitude];
    if(me) me.setLatLng(ll); else me=L.circleMarker(ll,{radius:9,color:'#fff',weight:3,fillColor:'#1d6fe0',fillOpacity:1}).addTo(map);
    map.flyTo(ll,15);
  },()=>{},{enableHighAccuracy:true,timeout:10000});
};

showCity();
addEventListener('resize',setSheetH);
</script>
</body>
